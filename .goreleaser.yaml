version: 2
project_name: mcp-virtualbox

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-virtualbox
    binary: mcp-virtualbox
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    # Matches the launcher's download URL: mcp-virtualbox_<os>_<arch>.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Rishaad-AWN
    name: mcp-virtualbox
  draft: false
  prerelease: auto

changelog:
  use: github
